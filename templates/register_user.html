{% extends "base.html" %}
{% block content %}
<h3>Adicionar Usuário</h3>
<form method="post" action="{{ url_for('admin_add_user') }}">
    <p><input type="text" name="username" placeholder="Usuário" required></p>
    <p><input type="password" name="password" placeholder="Senha" required></p>
    <p><input type="number" step="0.01" name="commission" placeholder="Comissão padrão" value="0.00"></p>
    <p><button type="submit">Criar Usuário</button></p>
</form>

<h3>Usuários</h3>
<ul>
{% for u in users %}
    <li>{{ u.username }} {% if u.is_admin %}(admin){% else %}- R$ {{ "%.2f"|format(u.commission_default) }}{% endif %}</li>
{% endfor %}
</ul>
{% endblock %}
